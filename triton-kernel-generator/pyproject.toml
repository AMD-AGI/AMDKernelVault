[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amdkernelvault-triton-kernelgen"
version = "0.1.0"
description = "Generate and verify generic Triton kernels on AMD GPUs"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "numpy>=1.26,<3"]
dev = ["ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
triton-kernelgen = "triton_kernel_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
